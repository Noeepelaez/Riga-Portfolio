<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Riga Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <style>
    body, h1, h2, h3 { font-family: "Montserrat", sans-serif; }
    body, html { margin: 0; padding: 0; }
  </style>
</head>

<body>

<!-- Sidebar -->
<nav class="w3-sidebar w3-black w3-animate-top w3-xxlarge" style="display:none;padding-top:150px" id="mySidebar">
  <button onclick="w3_close()" class="w3-button w3-black w3-xxlarge w3-padding w3-display-topright" style="padding:6px 24px">
    ×
  </button>
  <div class="w3-bar-block w3-center">
    <a href="./home.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Home</a>
    <a href="./portfolio.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Portfolio</a>
    <a href="./about-me.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">About me</a>
    <a href="./contact.html" class="w3-bar-item w3-button w3-text-grey w3-hover-black">Contact</a>
  </div>
</nav>

<!-- Page Content -->
<div>

  <!-- Top Bar -->
  <div class="w3-bar w3-white w3-padding">
    <a href="./home.html" class="w3-bar-item w3-button w3-hover-white w3-xlarge" style="margin-top: 4px; letter-spacing: 2px;">
      <b>RIGA</b> <span class="w3-medium w3-text-grey w3-hide-small" style="margin-left: 8px;">| Latvia</span>
    </a>
    <button class="w3-button w3-xxlarge w3-white w3-right" onclick="w3_open()">
      <i class="fa fa-bars"></i>
    </button>
  </div>

  <!-- Contact Section -->
  <div class="w3-content w3-container w3-padding-64" style="max-width:900px">
    
    <header class="w3-center w3-margin-bottom w3-padding-32">
      <h1 class="w3-xxlarge" style="letter-spacing: 3px;"><b>CONTACT</b></h1>
      <p class="w3-text-grey" style="letter-spacing: 1px;">Let's get in touch</p>
    </header>

    <div class="w3-row w3-padding-32">
      
      <!-- Información (Columna Izquierda) -->
      <div class="w3-col m5 w3-margin-bottom w3-padding-large">
        <div class="w3-text-grey" style="line-height: 2;">
          <p><i class="fa fa-map-marker fa-fw w3-large w3-margin-right"></i> Currently in Vilnius, Lithuania</p>
          <p><i class="fa fa-envelope fa-fw w3-large w3-margin-right"></i> npelaez2006@outlook.com</p>
        </div>
      </div>

      <!-- Formulario (Columna Derecha) -->
      <div class="w3-col m7 w3-padding-large">
        <!-- Nota: Para que el formulario funcione de verdad, necesitarás enlazarlo a un servicio externo -->
        <form action="https://formspree.io/f/maqvkzwq" method="POST">
          <div class="w3-row-padding" style="margin:0 -16px 8px -16px">
            <div class="w3-half">
              <input class="w3-input w3-border" type="text" placeholder="Name" required name="Name">
            </div>
            <div class="w3-half">
              <input class="w3-input w3-border" type="text" placeholder="Email" required name="Email">
            </div>
          </div>
          <input class="w3-input w3-border" type="text" placeholder="Message" required name="Message" style="margin-bottom:16px;">
          <button class="w3-button w3-black w3-right" type="submit">
            <i class="fa fa-paper-plane"></i> SEND MESSAGE
          </button>
        </form>
      </div>
      
    </div>
    
  </div>

</div>

<!-- Footer -->
<footer class="w3-container w3-padding-64 w3-light-grey w3-center w3-opacity w3-xlarge" style="margin-top:32px">
  
  <!-- Enlace a Instagram -->
  <a href="https://www.instagram.com/noeepelaez/" target = "_blank" style = "text-decoration: none; margin: 0 8px">
  <i class="fa fa-instagram w3-hover-opacity"></i>
  </a>
  
  <a href="https://www.linkedin.com/in/noé-peláez-miranda-8628353a9/" target="_blank" style="text-decoration: none; margin: 0 8px;">
  <i class="fa fa-linkedin w3-hover-opacity"></i>
  </a>
  
  <p class="w3-medium">
    Noé Peláez Miranda
  </p>
</footer>

<script>
function w3_open() {
  document.getElementById("mySidebar").style.width = "100%";
  document.getElementById("mySidebar").style.display = "block";
}
function w3_close() {
  document.getElementById("mySidebar").style.display = "none";
}
</script>

</body>
</html>
